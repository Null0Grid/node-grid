<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'">
  <title>Send to phone</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="qrpop">
  <div class="panel">
    <header>
      <span class="title">SEND TO PHONE</span>
      <button class="x" id="close" title="Close (Esc)"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </header>
    <div class="qrbox" id="qr"></div>
    <p class="qrtitle" id="qtitle"></p>
    <p class="qrurl" id="qurl"></p>
    <p class="qrnote" id="qnote">Point your phone's camera at the code.</p>
    <div class="btns"><button class="btn primary" id="copy">COPY LINK</button></div>
    <div class="status" id="status"></div>
  </div>
  <script src="qr.js"></script>
</body>
</html>
