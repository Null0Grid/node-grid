<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Peek</title>
  <link rel="stylesheet" href="peek.css">
</head>
<body>
  <div id="backdrop" title="Click to close (Esc)"></div>
  <section id="panel" role="dialog" aria-label="Peek preview">
    <header>
      <span class="badge">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
        PEEK · NO SCRIPTS
      </span>
      <span id="spin" class="spin" hidden></span>
      <span id="url" class="url"></span>
      <button id="source" class="btn" title="Show this page's raw HTML">SOURCE</button>
      <button id="real" class="btn primary" title="Load it normally in a new tab">OPEN FOR REAL</button>
      <button id="close" class="btn x" title="Close (Esc)">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </header>
    <div id="frame"></div>
  </section>
  <script src="peek.js"></script>
</body>
</html>
