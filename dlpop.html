<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'">
  <title>Downloads</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="dlpop">
  <div class="panel">
    <header>
      <span class="title">DOWNLOADS</span>
      <button class="x" id="close" title="Close (Esc)"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </header>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>Nothing downloaded yet.</p>
    <footer>
      <button class="btn" id="folder" title="Open your Downloads folder">DOWNLOADS FOLDER</button>
      <button class="btn" id="clear" title="Clear finished downloads from this list (the files stay)">CLEAR</button>
    </footer>
  </div>
  <script src="dlpop.js"></script>
</body>
</html>
