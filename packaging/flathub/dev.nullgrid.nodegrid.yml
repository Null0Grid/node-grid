# Flathub submission manifest for NODE_GRID.
#
# This is the manifest you'd put in a github.com/flathub/dev.nullgrid.nodegrid
# repo to get NODE_GRID onto Flathub — it's a different thing from the .flatpak
# file electron-builder produces locally (that one bundles a plain copy of the
# release build; this one builds from source inside the Freedesktop SDK the way
# Flathub requires, which is also why it's the version Flathub review expects).
#
# Build locally with: flatpak-builder --user --install build-dir dev.nullgrid.nodegrid.yml
# (needs the flathub remote added, and org.freedesktop.{Platform,Sdk}//23.08 +
# org.electronjs.Electron2.BaseApp//23.08 installed — see
# https://github.com/flathub/flathub/wiki/App-Submission for the full process.)
id: dev.nullgrid.nodegrid
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "23.08"
command: node-grid

finish-args:
  # Network: the browser's whole purpose, plus Null Search/Null Drive/Null Notes talk to it
  - --share=network
  # Windowing + input
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # Sound (the radio player, and audio/video on pages)
  - --socket=pulseaudio
  # GPU acceleration
  - --device=dri
  # Notifications (login vault / download alerts)
  - --talk-name=org.freedesktop.Notifications
  # Clipboard + session/idle state used by Electron on some desktops
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.ScreenSaver
  # Login vault secrets (libsecret, Settings → login vault)
  - --talk-name=org.freedesktop.secrets
  # Letting the user pick a save/open location from a native-feeling dialog
  - --filesystem=xdg-download

modules:
  - name: nullgrid-browser
    buildsystem: simple
    sources:
      - type: archive
        # Pin this to the exact released tag/version when cutting a Flathub
        # submission or update — Flathub requires a versioned, checksummed
        # source, never a moving branch reference.
        url: https://github.com/Null0Grid/node-grid/archive/refs/tags/5.1.2.tar.gz
        sha256: FILL_IN_FROM_THE_5.1.2_SOURCE_TARBALL
        x-checker-data:
          type: anitya
          url: https://github.com/Null0Grid/node-grid/releases

    build-commands:
      # Build the asar + unpacked resources the normal way, then lay them
      # out the way org.electronjs.Electron2.BaseApp expects: everything
      # under /app/main, launched by the base app's own `electron` binary.
      - npm ci
      - mkdir -p /app/main
      - cp -r package.json main.js *.html *.js *.css home tab-preload.js null-drive.js
          gear.html gear.js gear-preload.js pipdock.html pipdock.js pipdock-preload.js updatebot.html updatebot.js updatebot-preload.js
          node_modules doom fonts build /app/main/ 2>/dev/null || true
      - install -Dm644 home/icon-512.png /app/share/icons/hicolor/512x512/apps/dev.nullgrid.nodegrid.png
      - install -Dm644 packaging/flathub/dev.nullgrid.nodegrid.desktop /app/share/applications/dev.nullgrid.nodegrid.desktop
      - install -Dm644 packaging/flathub/dev.nullgrid.nodegrid.metainfo.xml /app/share/metainfo/dev.nullgrid.nodegrid.metainfo.xml
