name: Store package

# Builds just the Microsoft Store package (.appx) from the current branch,
# using the identity in store-identity.txt. Actions > Store package > Run
# workflow, then download the "store-package" artifact and upload the .appx
# in Partner Center (which signs it). The .appx is also attached to a draft
# release named "Store package <version>" (drafts are not public).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Test
        run: npm test
      - name: Apply Store identity
        run: node store-apply.js store-identity.txt
      - name: Build Store package
        run: npm run store
      - name: Check the package manifest
        shell: pwsh
        run: |
          $appx = Get-ChildItem store-dist/*.appx | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($appx.FullName)
          $e = $zip.Entries | Where-Object FullName -eq 'AppxManifest.xml'
          [xml]$m = (New-Object IO.StreamReader($e.Open())).ReadToEnd()
          $hasDoom = [bool]($zip.Entries | Where-Object FullName -like '*doom*')
          $zip.Dispose()
          $id = $m.Package.Identity; $p = $m.Package.Properties
          $vis = $m.Package.Applications.Application.VisualElements
          echo "::notice title=Package::$($appx.Name) ($([math]::Round($appx.Length/1MB)) MB)"
          echo "::notice title=Identity::Name=$($id.Name) Version=$($id.Version) Publisher=$($id.Publisher)"
          echo "::notice title=Names::DisplayName=$($p.DisplayName) | PublisherDisplayName=$($p.PublisherDisplayName) | Tile=$($vis.DisplayName)"
          $want = (Select-String -Path store-identity.txt -Pattern '^DISPLAY_NAME=(.*)$').Matches[0].Groups[1].Value.Trim()
          if ($p.DisplayName -ne $want -or $vis.DisplayName -ne $want) { echo "::error::DisplayName is not '$want'"; exit 1 }
          if ($id.Name -like 'FILLED_IN*') { echo "::error::identity not applied"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: store-dist/*.appx
          if-no-files-found: error
      - name: Attach to a draft release (private, for downloading the .appx)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="store-$v"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          cp store-dist/*.appx "NODE_GRID-$v-store.appx"
          gh release create "$tag" "NODE_GRID-$v-store.appx" --draft --target "$GITHUB_SHA" \
            --title "Store package $v (draft, not for the public)" \
            --notes "Unsigned Microsoft Store package for Partner Center. Upload the .appx there; it signs it. Kept as a draft so it is not public."
