name: Release

# Push a tag that matches the app version (package.json), with or without a
# "v": v5.0.1 or 5.0.1. Or, for a tag that already exists: Actions > Release
# > Run workflow, and type the tag.
# Builds the .deb, .rpm, AppImage and .tar.gz (x64 + arm64), the portable
# Windows build and the Microsoft Store package, and attaches them to the
# release for that tag (an existing release keeps its published/draft state;
# a new one is published). The .msix is a workflow artifact only: it's
# unsigned and meant for Partner Center, which signs it. store-identity.txt
# must be filled in (see STORE-STEPS.txt) for the Store job to build
# anything meaningful.
#
# .flatpak and .snap (x64 only) build in their own best-effort jobs
# (linux-flatpak, linux-snap): both targets are exercised locally and
# produce a correct electron-builder config, but actually building a
# flatpak needs the Freedesktop/Electron2 runtime from Flathub, and
# building a snap needs a working snapcraft backend — neither is something
# that could be verified from the sandbox this workflow was authored in, so
# both jobs are continue-on-error and their artifacts are "if produced,"
# not guaranteed on every run. If one fails, the other Linux formats and
# the release still go out.
#
# AUR (packaging/aur/PKGBUILD + .SRCINFO) and the Flathub submission
# manifest (packaging/flathub/) are maintained by hand, not built here —
# see packaging/aur/PKGBUILD's header comment and packaging/flathub/*.yml
# for how to update each on a new release.

on:
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (e.g. 5.0.0)"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Build jobs run third-party npm packages, so they only get to read; only the
# job that attaches the files to the release can write.
permissions:
  contents: read

jobs:
  version:
    name: Check tag matches the app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          app=$(node -p "require('./package.json').version")
          tag="${TAG#v}"
          if [ "$app" != "$tag" ]; then echo "::error::tag $TAG but package.json says $app"; exit 1; fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages (.deb, .rpm, AppImage, .tar.gz — x64 + arm64)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: rpmbuild (for the .rpm target)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build .deb, .rpm, AppImage, .tar.gz (x64 + arm64)
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            store-dist/*.deb
            store-dist/*.rpm
            store-dist/*.AppImage
            store-dist/*.tar.gz

  linux-flatpak:
    name: .flatpak (x64) — best effort
    needs: version
    runs-on: ubuntu-24.04
    continue-on-error: true # needs the Flathub runtime; see the note at the top of this file
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # --user: the runner isn't root, and electron-builder installs runtimes per user
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - name: Build .flatpak (x64)
        run: npm run dist:linux:flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: store-dist/*.flatpak
          if-no-files-found: ignore

  linux-snap:
    name: .snap (x64) — best effort
    needs: version
    runs-on: ubuntu-24.04
    continue-on-error: true # needs a working snapcraft backend; see the note at the top of this file
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build .snap (x64)
        run: npm run dist:linux:snap
      - uses: actions/upload-artifact@v4
        with:
          name: linux-snap
          path: store-dist/*.snap
          if-no-files-found: ignore

  windows:
    name: Windows portable build + Store package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build portable Windows build
        run: npm run dist
      - name: Zip the portable build
        shell: pwsh
        run: Compress-Archive -Path "dist/Null Grid-win32-x64" -DestinationPath "dist/Null-Grid-${{ needs.version.outputs.version }}-win32-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Null-Grid-*-win32-x64.zip
      - name: Build Store package (MSIX)
        run: |
          node store-apply.js store-identity.txt
          npm run store
        continue-on-error: true # needs store-identity.txt filled in from Partner Center; see STORE-STEPS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: store-dist/*.appx
          if-no-files-found: ignore

  store-submit:
    name: Send the Store package to the Microsoft Store
    # Submits this release's .appx to Partner Center, so Store copies get the
    # update through the Store once Microsoft certifies it (hours to a few days).
    # Needs four repository secrets and one variable; without them this job just
    # says so and skips -- see STORE-STEPS.txt > AUTOMATIC STORE UPDATES.
    needs: [version, windows]
    runs-on: windows-latest
    env:
      HAVE_KEYS: ${{ secrets.AZURE_AD_TENANT_ID != '' && secrets.AZURE_AD_APPLICATION_CLIENT_ID != '' && secrets.AZURE_AD_APPLICATION_SECRET != '' && secrets.SELLER_ID != '' && vars.STORE_PRODUCT_ID != '' }}
    steps:
      - name: Check for Partner Center keys
        if: env.HAVE_KEYS != 'true'
        run: echo "::notice title=Store submission skipped::Add the Partner Center secrets and the STORE_PRODUCT_ID variable (see STORE-STEPS.txt) to send releases to the Store automatically."
      - uses: actions/download-artifact@v4
        if: env.HAVE_KEYS == 'true'
        with:
          name: store-package
          path: store-package
      - name: Set up the Microsoft Store CLI
        if: env.HAVE_KEYS == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Sign in to Partner Center
        if: env.HAVE_KEYS == 'true'
        run: msstore reconfigure --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" --sellerId "${{ secrets.SELLER_ID }}" --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"
      - name: Submit the package
        if: env.HAVE_KEYS == 'true'
        shell: pwsh
        run: |
          $appx = Get-ChildItem store-package/*.appx | Select-Object -First 1
          if (-not $appx) { echo "::error::No Store package was built for this release"; exit 1 }
          msstore publish "$($appx.FullName)" -id "${{ vars.STORE_PRODUCT_ID }}"

  release:
    name: Attach to the GitHub release
    needs: [version, linux, windows, linux-flatpak, linux-snap]
    if: always() && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          append_body: true
          name: Null Grid ${{ needs.version.outputs.version }}
          fail_on_unmatched_files: true      # the core packages must all be there
          files: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.AppImage
            dist/linux/*.tar.gz
            dist/windows/*.zip
          body: |
            **Windows:** unzip `Null-Grid-${{ needs.version.outputs.version }}-win32-x64.zip` and run the program inside (portable, no installer), or get it from the Microsoft Store.
            **Linux — x64 and arm64:**
            - Any distro, no install needed: download `Null-Grid-${{ needs.version.outputs.version }}-x86_64.AppImage` (x64) or `Null-Grid-${{ needs.version.outputs.version }}-arm64.AppImage`, `chmod +x` it, and run it.
            - Ubuntu 24.04+ / Debian 13+: `sudo apt install ./nullgrid-browser_${{ needs.version.outputs.version }}_amd64.deb` (or `_arm64.deb`)
            - Fedora / openSUSE / RHEL: `sudo rpm -i nullgrid-browser-${{ needs.version.outputs.version }}.x86_64.rpm` (or `.aarch64.rpm`)
            - Anything else: unpack `nullgrid-browser-${{ needs.version.outputs.version }}.tar.gz` (or `-arm64.tar.gz`) and run the program inside.
            - Flatpak / Snap, if this run built them: see this release's `.flatpak`/`.snap` assets. (Both build in best-effort CI jobs — if a job fails this run, grab the AppImage/.deb/.rpm/.tar.gz instead; see README.)
            - Arch (AUR): `nullgrid-browser-bin` — see `packaging/aur/` in this repo for the PKGBUILD.

            The Microsoft Store package, if built, is in this run's `store-package` artifact (upload it in Partner Center).
      # Flatpak and Snap are best-effort: attach them only if their jobs made them,
      # so a failed best-effort job never stops the release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: false
          files: |
            dist/linux-flatpak/*.flatpak
            dist/linux-snap/*.snap
