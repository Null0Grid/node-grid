name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries (Electron + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libuuid1 libsecret-1-0 libgbm1 libasound2t64 xvfb xdotool
      - run: npm ci
      - name: Frontend/backend syntax
        run: |
          for f in $(find . -maxdepth 1 -name "*.js"); do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: Drive connection tests (null-drive.js, no Electron)
        run: npm test
      - name: Drive connection, live in the app (Electron + Playwright, under Xvfb)
        run: xvfb-run -a npm run test:ui
      - name: Update checks, update bot, Settings > UPDATES, sidebar hover switch (live in the app)
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:ui:updates
      - name: Picture-in-picture docking (live in the app)
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:ui:pipdock
      - name: Not-secure warning for http sites (live in the app)
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:ui:insecure
      - name: Tabs across the top (live in the app)
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:ui:tabstop
      - name: Several windows (live in the app)
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:ui:windows
      - name: Renamed to Null Grid (no old name left; updating from before the rename keeps everything)
        run: |
          npm run test:rename
          xvfb-run -a -s "-screen 0 1400x900x24" npm run test:ui:rename
      - name: Self-update, end to end (old .tar.gz build updates itself to a new one)
        run: |
          npx electron-builder --linux dir --x64 --publish never -c.directories.output="$RUNNER_TEMP/old" > "$RUNNER_TEMP/b1.log" 2>&1 || { echo "::error title=build::$(tail -c 800 "$RUNNER_TEMP/b1.log" | tr '\n' ' ')"; exit 1; }
          npx electron-builder --linux dir --x64 --publish never -c.extraMetadata.version=9.9.9 -c.directories.output="$RUNNER_TEMP/new" > "$RUNNER_TEMP/b2.log" 2>&1 || { echo "::error title=build::$(tail -c 800 "$RUNNER_TEMP/b2.log" | tr '\n' ' ')"; exit 1; }
          mv "$RUNNER_TEMP/new/linux-unpacked" "$RUNNER_TEMP/new/nullgrid-browser-9.9.9"
          tar czf "$RUNNER_TEMP/nullgrid-browser-9.9.9.tar.gz" -C "$RUNNER_TEMP/new" nullgrid-browser-9.9.9
          SU_OLD="$RUNNER_TEMP/old/linux-unpacked" SU_NEW="$RUNNER_TEMP/nullgrid-browser-9.9.9.tar.gz" SU_NEW_VERSION=9.9.9 \
            xvfb-run -a -s "-screen 0 1400x900x24" node tests/selfupdate.test.js

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Drive connection tests (null-drive.js, no Electron)
        run: npm test
      - name: Self-update, end to end (old portable build updates itself to a new .zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist *> "$env:RUNNER_TEMP/b1.log"; if ($LASTEXITCODE) { $t = (Get-Content "$env:RUNNER_TEMP/b1.log" -Raw) -replace "`r?`n", ' '; Write-Output ("::error title=build::" + $t.Substring([Math]::Max(0, $t.Length - 800))); exit 1 }
          Move-Item "dist/Null Grid-win32-x64" "$env:RUNNER_TEMP/old"
          npm pkg set version=9.9.9
          npm run dist *> "$env:RUNNER_TEMP/b2.log"; if ($LASTEXITCODE) { Write-Output "::error title=build::second build failed"; exit 1 }
          Compress-Archive -Path "dist/Null Grid-win32-x64" -DestinationPath "$env:RUNNER_TEMP/Null-Grid-9.9.9-win32-x64.zip"
          git checkout -- package.json
          $env:SU_OLD = "$env:RUNNER_TEMP/old"; $env:SU_NEW = "$env:RUNNER_TEMP/Null-Grid-9.9.9-win32-x64.zip"; $env:SU_NEW_VERSION = "9.9.9"
          node tests/selfupdate.test.js
