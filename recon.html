<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'">
  <title>Recon</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="recon">
  <div class="panel">
    <header>
      <span class="r-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/></svg></span>
      <span class="title">RECON</span>
      <span class="site" id="host"></span>
      <button class="x" id="copy" title="Copy report">COPY</button>
      <button class="x" id="close" title="Close (Esc)"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </header>
    <div class="scroll" id="body">
      <section data-k="ips"><h3>ADDRESSES</h3><div class="v wait">resolving…</div></section>
      <section data-k="asn"><h3>NETWORK</h3><div class="v wait">asking who owns it…</div></section>
      <section data-k="tls"><h3>CERTIFICATE</h3><div class="v wait">connecting…</div></section>
      <section data-k="http"><h3>HTTP + SECURITY HEADERS</h3><div class="v wait">…</div></section>
      <section data-k="dns"><h3>DNS RECORDS</h3><div class="v wait">querying…</div></section>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
  <script src="recon.js"></script>
</body>
</html>
