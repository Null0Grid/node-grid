<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Settings</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    button {
      width: 100%; height: 100%; display: grid; place-items: center; cursor: pointer;
      background: rgba(16, 19, 27, .82); border: 1px solid #1f2a3a; border-radius: 50%; color: #5a6b80;
      transition: color .15s, border-color .15s, box-shadow .15s, transform .3s;
    }
    button:hover { color: #00e5ff; border-color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, .45); transform: rotate(60deg); }
    svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }
  </style>
</head>
<body>
  <button id="g" title="Settings (Ctrl+,)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
  </button>
  <script src="gear.js"></script>
</body>
</html>
